[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:vnc]
command=Xtigervnc :1 -geometry %(ENV_DOCGEN_GEOMETRY)s -depth 24 -rfbport 5901 -localhost -SecurityTypes VncAuth -PasswordFile /home/docgen/.vnc/passwd -AlwaysShared
priority=10
autorestart=true
stdout_logfile=/tmp/vnc.log
redirect_stderr=true

[program:desktop]
command=/usr/local/bin/docgen-start-desktop
priority=20
autorestart=true
startsecs=3
stdout_logfile=/tmp/desktop.log
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5901
priority=30
autorestart=true
stdout_logfile=/tmp/novnc.log
redirect_stderr=true

[program:api]
command=python3 -m uvicorn api.server:app --host 0.0.0.0 --port 8080 --log-level info
directory=/app
priority=40
autorestart=true
stdout_logfile=/data/runs/api.log
redirect_stderr=true
